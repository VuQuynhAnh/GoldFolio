# Build app widget Android (HOLD-UC02) và đính APK vào bản phát hành mới nhất trên GitHub,
# để tải thẳng về điện thoại. Không cần cài Android Studio trên máy.
name: Android widget

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-widget.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      # Khoá ký cố định để bản mới cài đè được bản cũ (nút "Cập nhật" trong app). Lần build đầu tự tạo
      # khoá rồi lưu vào repo (android/release-key.p12); các lần sau dùng lại, không bao giờ tạo lại.
      # Mật khẩu: Secret ANDROID_KEYSTORE_PASSWORD nếu có; không có thì dùng mật khẩu ghi sẵn dưới đây
      # (user chốt 2026-11-18: app cá nhân, chấp nhận khoá công khai để khỏi phải đặt Secret). Rủi ro:
      # người khác ký được APK giả cùng khoá, nhưng chỉ cài được nếu chủ máy tự tải file lạ về cài; nút
      # Cập nhật trong app chỉ tải từ Releases của repo này.
      - name: Khoá ký cố định
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'goldfolio-public-key' }}
        run: |
          KS=android/release-key.p12
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias app -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GoldFolio"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KS"
            git commit -m "chore: khoá ký APK cố định (CI tạo tự động một lần) [skip ci]"
            git push
          fi
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/$KS" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'goldfolio-public-key' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'goldfolio-public-key' }}
          ANDROID_KEY_ALIAS: app
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/goldfolio-widget.apk"

      - name: Phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="widget-v${{ github.run_number }}"
          gh release create "$tag" "$RUNNER_TEMP/goldfolio-widget.apk" \
            --title "GoldFolio 1.0.${{ github.run_number }}" \
            --notes "Tải goldfolio-widget.apk về điện thoại Android rồi mở để cài. Hướng dẫn: GoldFolio → Widget." \
            --target "${{ github.sha }}" --latest
