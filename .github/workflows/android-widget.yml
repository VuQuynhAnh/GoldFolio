# Build app widget Android (HOLD-UC02) và đính APK vào bản phát hành mới nhất trên GitHub,
# để tải thẳng về điện thoại. Không cần cài Android Studio trên máy.
name: Android widget

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-widget.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      # Khoá ký cố định để bản mới cài đè được bản cũ (nút "Cập nhật" trong app). Chỉ cần một Secret
      # ANDROID_KEYSTORE_PASSWORD (mật khẩu tự đặt). Lần build đầu có mật khẩu thì tự tạo khoá, khoá
      # bằng mật khẩu đó rồi lưu vào repo (android/release-key.p12); các lần sau dùng lại.
      # Chưa có mật khẩu thì ký bằng khoá debug: cài được nhưng mỗi bản mới phải gỡ app cũ.
      - name: Khoá ký cố định
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::warning::Chưa đặt Secret ANDROID_KEYSTORE_PASSWORD, APK ký bằng khoá debug"
            exit 0
          fi
          KS=android/release-key.p12
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias app -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GoldFolio"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KS"
            git commit -m "chore: khoá ký APK cố định (tạo tự động, khoá bằng mật khẩu trong Secrets) [skip ci]"
            git push
          fi
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/$KS" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: app
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/goldfolio-widget.apk"

      - name: Phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="widget-v${{ github.run_number }}"
          gh release create "$tag" "$RUNNER_TEMP/goldfolio-widget.apk" \
            --title "GoldFolio 1.0.${{ github.run_number }}" \
            --notes "Tải goldfolio-widget.apk về điện thoại Android rồi mở để cài. Hướng dẫn: GoldFolio → Widget." \
            --target "${{ github.sha }}" --latest
